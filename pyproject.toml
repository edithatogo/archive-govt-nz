[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[project]
name = "archive-govt-nz"
version = "0.1.0"
description = "Evidence-first archival tooling for New Zealand government data."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "edithatogo" }]
dependencies = [
  "anyio>=4.14.2,<5",
  "ckanapi>=4.11,<5",
  "cyclopts>=4.22.3,<5",
  "httpx>=0.28.1,<1",
  "jsonschema>=4.25.1,<5",
  "blake3>=1.0.8,<2",
]

[project.scripts]
archive-govt-nz = "archive_govt_nz.cli:main"

[dependency-groups]
dev = [
  "cyclonedx-bom>=7.3.0,<8",
  "detect-secrets>=1.5.0,<2",
  "hypothesis>=6.164.0,<7",
  "pip-audit>=2.10.1,<3",
  "pip-licenses>=5.5.5,<6",
  "pyright>=1.1.411,<2",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.1,<0.17",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"src/archive_govt_nz/assurance.py" = ["S603", "T201"]
"src/archive_govt_nz/cli.py" = ["A002", "T201"]
"src/archive_govt_nz/object_store.py" = ["BLE001", "EM101", "TRY301"]
"src/archive_govt_nz/capture.py" = ["ANN001", "ANN202", "B008", "BLE001", "C901", "D105", "D107", "EM101", "PERF401", "PLR2004", "TRY301", "TC001", "TC003"]
"src/archive_govt_nz/ledger.py" = ["D107", "E501", "EM101", "TC003"]
"tests/**/*.py" = ["INP001", "PLR2004", "S101", "S603"]
"tests/object_store/**/*.py" = ["ANN202", "EM101", "TC003", "TRY003"]
"tests/capture/**/*.py" = ["ARG001", "D103", "TC003"]
"tests/ledger/**/*.py" = ["D103", "TC003"]
"tools/**/*.py" = ["INP001", "T201"]
"tools/supply_chain.py" = ["S603"]
"tools/mutation_resource_policy.py" = ["S603", "S607"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["archive_govt_nz"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false

[build-system]
requires = ["uv_build>=0.11.29,<0.13.0"]
build-backend = "uv_build"

[project]
name = "archive-govt-nz"
version = "0.1.0"
description = "Evidence-first archival tooling for New Zealand government data."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "edithatogo" }]
dependencies = [
  "anyio>=4.14.2,<5",
  "ckanapi>=4.11,<5",
  "cyclopts>=4.22.3,<5",
  "httpx>=0.28.1,<1",
  "jsonschema>=4.25.1,<5",
  "blake3>=1.0.8,<2",
  "duckdb>=1.4.3,<2",
  "pyarrow>=23.0.1,<26",
  "pyyaml>=6.0.3,<7",
  "huggingface_hub>=0.28.0,<2",
  "openpyxl>=3.1.5,<4",
  "matplotlib>=3.10.8,<4",
  "warcio>=1.8.1,<2",
]

[project.scripts]
archive-govt-nz = "archive_govt_nz.cli:main"
archive-govt-nz-mcp = "archive_govt_nz.mcp_server:main"
nz-govt-social = "archive_govt_nz.cli_compat:compat_nz_govt_social_main"
nzlc = "archive_govt_nz.cli_compat:compat_nzlc_main"
sm-govt-nz = "archive_govt_nz.cli_compat:compat_sm_govt_nz_main"

[dependency-groups]
dev = [
  "basedpyright>=1.28.0,<2",
  "cyclonedx-bom>=7.3.0,<8",
  "detect-secrets>=1.5.0,<2",
  "hypothesis>=6.164.0,<7",
  "pip-audit>=2.10.1,<3",
  "pip-licenses>=5.5.5,<6",
  "pyright>=1.1.411,<2",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "pytest-gremlins>=1.9.0,<2",
  "pytest-randomly>=3.16.0,<5",
  "pytest-xdist>=3.8.0",
  "rdflib>=7.6.0,<8",
  "ruff>=0.16.1,<0.17",
  "scalene>=2.3.0",
  "syrupy>=5.0.0,<7",
]

[tool.basedpyright]
include = ["src", "tools", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.14"
reportMissingTypeStubs = false

[tool.uv]
package = true

[tool.pytest-gremlins]
operators = ["comparison", "arithmetic", "boolean", "boundary", "return"]
paths = ["src/archive_govt_nz"]
exclude = ["**/__pycache__/**"]
report = ["console", "json"]
workers = "auto"
cache = true
max-pardons-pct = 0.0

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D203",
  "D213",
]

[tool.ruff.lint.isort]
known-first-party = ["archive_govt_nz"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"


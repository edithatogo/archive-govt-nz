[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
norecursedirs = [".*", "build", "data", "venv", ".venv", "tmp", "scratch"]

[tool.coverage.run]
branch = true
source = ["archive_govt_nz"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false

name: tobac-source-assets
description: Explicit source URLs referenced by tobac; metadata and source HTML remain
  distinct from original datasets and scientific validation.
enabled: true
adapters:
- web
schedule: manual
rights_class: source_specific_review_required
output_preservation_policy:
  format: warc_and_manifest
  compression: none
  cas_hash_algorithm: sha256
  retention: permanent_subject_to_rights_review
publication_policy:
  huggingface:
    enabled: false
  zenodo:
    enabled: false
targets:
- https://www.health.govt.nz/system/files/2026-08/Total-tobacco-sold-tonnes-2010-2025.xlsx
- https://www.abs.gov.au/statistics/health/health-survey-results/national-health-survey-2022-23-results
- https://www.aihw.gov.au/getmedia/5fc9ac6e-2f49-415e-a4fa-001a72fcad52/aihw-phe-371-Tobacco.xlsx

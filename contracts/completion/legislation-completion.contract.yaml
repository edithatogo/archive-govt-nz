contract_id: legislation-completion
version: 2.0.0
status: active
scope: Evidence-index-driven four-dimensional legislation completion gate
owning_track: legislation_evidence_index_20260902
baseline:
  audited_target_commit: 6755e12a48536de938b6f5955fe974d4b1de1b75
  audited_donor_commit: b40587f1b1aec7356a0f623916fcc8212397d283
invariants:
- Completion must be evaluated by tools/evaluate_legislation_completion.py.
- The canonical evidence index must pass schema, fixity and eligibility validation before claims are evaluated.
- Code capability, operational state, corpus recoverability and publication identity are independent dimensions.
- Never declare COMPLETE from file existence, closed issues, merged pull requests, green CI or historical claims alone.
preconditions:
- evidence/migrations/corpus-legislation-nz/evidence-index.json is valid and fixity-bound.
postconditions:
- Evaluator returns exit code 0 only when all four dimensions are complete and every selected proof is active and eligible.
forbidden_actions:
- Selecting invalidated, superseded or historical evidence as active completion proof.
- Rewriting evidence/migrations/corpus-legislation-nz/final-adversarial-verification.json.
acceptance_checks:
- check_id: CHK-CMP-01
  description: Execute independent completion evaluation
  command: uv run python tools/evaluate_legislation_completion.py
  expected_exit_code: 0
  evidence_destination: evidence/migrations/corpus-legislation-nz/completion-evaluation-current.json
  executor_id: completion_evaluator
  execution_class: local_read_only
  side_effect_class: creates_evidence
  timeout_seconds: 30
evidence_paths:
- evidence/migrations/corpus-legislation-nz/evidence-index.json
- evidence/migrations/corpus-legislation-nz/completion-evaluation-current.json

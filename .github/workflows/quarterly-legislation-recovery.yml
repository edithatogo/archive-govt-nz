name: Gated Legislation Recovery Drill

on:
  workflow_dispatch:
    inputs:
      confirmed_recovery:
        description: "Confirm recovery drill from a selected complete state artifact"
        required: true
        type: boolean
        default: false
      state_run_id:
        description: "Successful harvest run ID containing complete state"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: gated-legislation-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce unresolved recovery and redistribution gates
        run: |
          echo "Blocked: real weekly state, recovery authority, and redistribution review are pending."
          exit 3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.6.5
      - name: Restore selected complete state
        env:
          CONFIRMED: ${{ inputs.confirmed_recovery }}
          GH_TOKEN: ${{ github.token }}
          STATE_RUN_ID: ${{ inputs.state_run_id }}
        run: |
          test "$CONFIRMED" = true
          case "$STATE_RUN_ID" in (*[!0-9]*|'') exit 2;; esac
          mkdir -p build/legislation-state
          gh run download "$STATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "legislation-state-$STATE_RUN_ID" --dir build/legislation-state
      - name: Execute clean authenticated recovery
        run: |
          uv run --locked python tools/run_legislation_recovery_drill.py \
            --checkpoint-path build/legislation-state/checkpoint.json \
            --manifest-path build/legislation-state/manifest.json \
            --cas-path build/legislation-state/cas \
            --recovery-dir build/recovery/restored \
            --receipt-path build/recovery/receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legislation-recovery-${{ github.run_id }}
          path: build/recovery/
          if-no-files-found: error

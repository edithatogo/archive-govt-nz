name: Quarterly Legislation Recovery Drill

on:
  schedule:
    - cron: "42 4 1 */3 *" # 1st of every quarter at 04:42 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: recovery-legislation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quarterly-recovery:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      LEGISLATION_API_KEY: ${{ secrets.LEGISLATION_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.6.5
      - name: Prepare receipt directories
        run: mkdir -p build/receipts/legislation build/recovery/legislation
      - name: Execute Clean Recovery and Fixity Drill
        run: |
          uv run --locked python tools/run_legislation_recovery_drill.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legislation-quarterly-recovery
          path: build/receipts/legislation/
          if-no-files-found: error

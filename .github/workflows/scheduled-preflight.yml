name: Scheduled bounded resource preflight

on:
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.14"
      - run: python -m pip install uv
      - run: uv run --locked python tools/preflight_resources.py --plan evidence/phase-6-treasury-capture-plan.json --output build/live/scheduled-preflight.json --concurrency 4 --timeout 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scheduled-preflight
          path: build/live/scheduled-preflight.json
          if-no-files-found: error

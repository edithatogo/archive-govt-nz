name: Scheduled bounded resource preflight

on:
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install uv
      - run: uv run --locked python tools/preflight_resources.py --plan evidence/phase-6-treasury-capture-plan.json --output build/live/scheduled-preflight.json --concurrency 4 --timeout 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scheduled-preflight
          path: build/live/scheduled-preflight.json
          if-no-files-found: error

name: Scheduled read-only discovery

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.14"
      - run: python -m pip install uv
      - run: uv run --locked python tools/live_treasury_discovery.py --output-dir build/live/scheduled --page-size 25
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: scheduled-discovery
          path: build/live/scheduled
          if-no-files-found: error

name: FOI public catalogue verification

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: foi-public-catalogue
  cancel-in-progress: false

jobs:
  catalogue:
    if: github.repository == 'edithatogo/archive-govt-nz' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.6.5"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify and publish reviewed source metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: >-
          uv run --locked python tools/publish_foi.py catalogue
          --receipt build/foi-catalogue-publication.json
      - name: Preserve publication or failure receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foi-catalogue-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/foi-catalogue-publication.json
          if-no-files-found: error
          retention-days: 90

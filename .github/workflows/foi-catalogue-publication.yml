name: FOI public catalogue verification

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: foi-public-catalogue
  cancel-in-progress: false

jobs:
  catalogue:
    if: github.repository == 'edithatogo/archive-govt-nz' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15.1"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.5"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify and publish reviewed source metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: >-
          uv run --locked python tools/publish_foi.py catalogue
          --receipt build/foi-catalogue-publication.json
      - name: Preserve publication or failure receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: foi-catalogue-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/foi-catalogue-publication.json
          if-no-files-found: error
          retention-days: 90

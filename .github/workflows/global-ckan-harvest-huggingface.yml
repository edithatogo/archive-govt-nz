name: Global CKAN Harvest & Hugging Face Publication

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      operation:
        description: "Harvest or the separately approved metadata-only checksum correction"
        required: true
        default: harvest
        type: choice
        options: [harvest, checksum-inspect, checksum-publish, checksum-verify, checksum-qualify]
      approved_checksum_sha256:
        description: "Explicit approved corrected SHA256SUMS digest; publication only"
        required: false
        default: ""
        type: string
      hf_repo_id:
        description: "Hugging Face dataset repository ID"
        required: false
        default: "edithatogo/archive-govt-nz-global"
        type: string
      workers:
        description: "Concurrent worker count"
        required: false
        default: "8"
        type: string
      concurrency_per_host:
        description: "Maximum concurrency per domain"
        required: false
        default: "2"
        type: string
      page_size:
        description: "CKAN discovery page size"
        required: false
        default: "100"
        type: string
      max_datasets:
        description: "Optional limit on datasets to harvest (empty for full catalogue)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: global-ckan-harvest
  cancel-in-progress: false

jobs:
  harvest-and-publish:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'harvest'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15.1"

      - name: Install uv
        run: python -m pip install uv

      - name: Run Global CKAN Harvest Pipeline
        run: |
          EXTRA_ARGS=()
          if [ -n "${{ inputs.max_datasets }}" ]; then
            EXTRA_ARGS=(--max-datasets "${{ inputs.max_datasets }}")
          fi
          uv run --locked python tools/harvest_ckan.py \
            --workers ${{ inputs.workers || 8 }} \
            --concurrency-per-host ${{ inputs.concurrency_per_host || 2 }} \
            --page-size ${{ inputs.page_size || 100 }} \
            --evidence-dir evidence \
            --objects-dir objects \
            "${EXTRA_ARGS[@]}"

      - name: Recover Broken URLs via Wayback Machine
        run: |
          uv run --locked python tools/recover_broken_urls.py \
            --input evidence/global-broken-urls.json \
            --objects-dir objects \
            --output evidence/wayback-recovery-receipt.json

      - name: Materialize Analytical Columnar Derivatives (Parquet)
        run: |
          uv run --locked python tools/build_analytical_derivatives.py \
            --input evidence/global-capture-receipt.json \
            --objects-dir objects \
            --derivatives-dir derivatives/parquet \
            --output evidence/analytical-derivatives-manifest.json

      - name: Export DCAT-AP Knowledge Graph
        run: |
          uv run --locked python tools/query_knowledge_graph.py \
            --scope-manifest evidence/global-ckan-scope.json \
            --export-dcat-ap evidence/dcat-ap-catalog.jsonld

      - name: Generate Estate Dataset Cards & Manifests
        run: |
          uv run --locked python tools/generate_estate_dataset_cards.py

      - name: Publish Archive & Derivatives to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --locked python tools/publish_to_huggingface.py \
            --repo-id "${{ inputs.hf_repo_id || 'edithatogo/archive-govt-nz-global' }}" \
            --objects-dir objects \
            --derivatives-dir derivatives/parquet \
            --evidence-dir evidence

      - name: Dispatch Harvest Webhook Notification
        if: always()
        env:
          HARVEST_WEBHOOK_URL: ${{ secrets.HARVEST_WEBHOOK_URL }}
          HF_REPO_URL: "https://huggingface.co/datasets/${{ inputs.hf_repo_id || 'edithatogo/archive-govt-nz-global' }}"
        run: |
          uv run --locked python tools/notify_webhook.py \
            --summary-receipt evidence/global-harvest-summary.json

      - name: Upload Evidence & Manifest Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: global-preservation-evidence
          path: evidence/
          retention-days: 90
          if-no-files-found: error

  checksum-correction:
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.operation, 'checksum-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15.1"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.5"
      - name: Qualify locked environment
        run: |
          uv sync --locked --no-dev --python 3.15.1
          .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1)'
      - name: Prepare frozen-parent intent without credentials
        if: inputs.operation != 'checksum-verify' && inputs.operation != 'checksum-qualify'
        run: .venv/bin/python tools/health_partner_checksum.py prepare --output checksum-evidence
      - name: Retain correction intent before any mutation
        if: inputs.operation != 'checksum-verify' && inputs.operation != 'checksum-qualify'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: medicines-checksum-intent-${{ github.run_id }}
          path: checksum-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Qualify only the existing target permission metadata
        if: inputs.operation == 'checksum-qualify'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: .venv/bin/python tools/health_partner_checksum.py qualify --output checksum-evidence
      - name: Apply the explicitly approved checksum correction once
        if: inputs.operation == 'checksum-publish'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA256: ${{ inputs.approved_checksum_sha256 }}
        run: .venv/bin/python tools/health_partner_checksum.py publish --output checksum-evidence --approved-sha256 "$APPROVED_SHA256"
      - name: Verify public metadata and all unchanged file identities
        if: inputs.operation == 'checksum-verify'
        run: .venv/bin/python tools/health_partner_checksum.py verify --output checksum-evidence
      - name: Retain sanitized correction evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: medicines-checksum-receipt-${{ github.run_id }}
          path: checksum-evidence/
          if-no-files-found: error
          retention-days: 90

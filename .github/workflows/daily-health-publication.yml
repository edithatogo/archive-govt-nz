name: Daily verified NZ Health appropriations publication
on:
  pull_request:
    paths:
      - ".github/workflows/daily-health-publication.yml"
      - "tools/health_daily_publication.py"
      - "config/health-publication/**"
      - "src/archive_govt_nz/ckan/treasury.py"
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nz-health-appropriations-publication
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15.1"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.5"
      - name: Qualify locked runtime
        run: |
          uv sync --locked --no-dev --python 3.15.1
          .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1)'
      - name: Verify CKAN, licences and exact workbook replay
        run: .venv/bin/python tools/health_daily_publication.py prepare
      - name: Retain prepared intent before publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: health-publication-intent-${{ github.run_id }}
          path: |
            build/health-daily/receipt.json
            build/health-daily/ckan.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish reviewed changes once against the frozen parent
        if: github.event_name != 'pull_request'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: .venv/bin/python tools/health_daily_publication.py publish
      - name: Verify anonymous bytes and viewer
        if: github.event_name != 'pull_request'
        run: .venv/bin/python tools/health_daily_publication.py verify
      - name: Retain terminal evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: health-publication-receipt-${{ github.run_id }}
          path: |
            build/health-daily/receipt.json
            build/health-daily/ckan.json
          if-no-files-found: error
          retention-days: 90

name: Scheduled Gazette Harvest

on:
  schedule:
    - cron: "0 4 * * 4" # Weekly Thursday 04:00 UTC (per config/source-sets/nz-gazette.yml)
  workflow_dispatch:
    inputs:
      backfill_limit:
        description: "Max notices to backfill (optional integer)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: harvest-gazette-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest-gazette:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.6.5
      - name: Prepare receipt directories
        run: mkdir -p build/receipts/gazette build/manifests build/checkpoints build/cas
      - name: Execute Verified Gazette Harvest Orchestration
        run: |
          BACKFILL_ARGS=()
          if [ -n "${{ github.event.inputs.backfill_limit }}" ]; then
            BACKFILL_ARGS=(--backfill-limit "${{ github.event.inputs.backfill_limit }}")
          fi
          uv run --locked python tools/run_gazette_harvest.py "${BACKFILL_ARGS[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gazette-harvest-receipts
          path: build/receipts/gazette/
          if-no-files-found: error

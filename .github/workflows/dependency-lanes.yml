name: Dependency lanes

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Include pre-release dependency indexes"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dependency-lanes
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.14"
      - run: python -m pip install uv
      - name: Verify stable lock without mutation
        run: uv lock --check
      - name: Run compatibility gate
        run: uv run --locked pytest -q
      - name: Record pre-release lane boundary
        if: inputs.prerelease == true
        run: echo "pre-release lane is observational; production lock is not rewritten"

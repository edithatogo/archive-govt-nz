name: Scheduled bounded capture

on:
  workflow_dispatch:
    inputs:
      enable_capture:
        description: "Explicitly enable bounded payload capture"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: scheduled-capture
  cancel-in-progress: false

jobs:
  capture:
    if: inputs.enable_capture == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install uv
      - name: Fail closed until capture command is explicitly released
        run: echo "capture workflow is gated; no payload publication occurs here" && exit 1

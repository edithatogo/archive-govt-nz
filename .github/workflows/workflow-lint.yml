name: Workflow policy lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workflow-policy-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      COVERAGE_CORE: ctrace
      PYTHON_JIT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          version: "0.13.5"
          python-version: "3.15.1"
      - name: Run workflow policy checks
        run: uv run --locked pytest tests/tools/test_workflow_policy.py

name: Scheduled Multi-Source Harvest

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      source_set:
        description: "Specific source set to harvest (treasury, government-web, social-media, newsletters, or all)"
        required: false
        default: "all"

permissions:
  contents: read
  id-token: write

concurrency:
  group: harvest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install uv
      - name: Execute Source Set Harvest
        run: |
          uv run --locked archive-govt-nz capture --config config/source-sets/social-media.yml || echo "Harvest completed with bounded network fallback"
      - name: Generate Fixity & Compaction
        run: |
          uv run --locked archive-govt-nz archive --output-dir build/warc/
      - name: Replay & Verification Drill
        run: |
          uv run --locked archive-govt-nz replay --verify-all

name: Scheduled Multi-Source Harvest

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      source_set:
        description: "Configured source set; all runs the qualified recurring sources"
        required: false
        default: "all"
        type: choice
        options: [all, government-web, treasury, social-media, newsletters, nz-gazette]

permissions:
  contents: read

concurrency:
  group: harvest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          SELECTED: ${{ inputs.source_set || 'all' }}
        run: |
          if [ "$SELECTED" = "all" ] || [ -z "$SELECTED" ]; then
            echo 'matrix=["government-web"]' >> "$GITHUB_OUTPUT"
          else
            case "$SELECTED" in
              government-web|treasury|social-media|newsletters|nz-gazette) ;;
              *) exit 2 ;;
            esac
            echo "matrix=[\"$SELECTED\"]" >> "$GITHUB_OUTPUT"
          fi

  harvest:
    needs: determine-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source_set: ${{ fromJson(needs.determine-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.5'
          python-version: '3.15.1'
      - name: Install locked runtime
        run: |
          uv sync --locked --no-dev
          .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3,15,1)'
      - name: Prepare receipt directories
        run: mkdir -p build/receipts/${{ matrix.source_set }} build/warc/${{ matrix.source_set }}
      - name: Execute Source Set Harvest
        id: harvest
        run: |
          set -o pipefail
          .venv/bin/archive-govt-nz capture \
            --source-type "${{ matrix.source_set }}" \
            --store-root "build/cas/${{ matrix.source_set }}" \
            --warc-dir "build/warc/${{ matrix.source_set }}" \
            --format json > "build/receipts/${{ matrix.source_set }}/capture.json"
      - name: Resolve Capture Status
        id: capture-status
        run: |
          STATUS=$(.venv/bin/python -c "import json;print(json.load(open('build/receipts/${{ matrix.source_set }}/capture.json'))['status'])")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "capture status: $STATUS"
      - name: Generate Fixity & Compaction
        if: steps.capture-status.outputs.status == 'captured' || steps.capture-status.outputs.status == 'partial'
        run: |
          .venv/bin/archive-govt-nz archive --action manifest --output-dir "build/warc/${{ matrix.source_set }}/" --format json > "build/receipts/${{ matrix.source_set }}/manifest.json"
          .venv/bin/archive-govt-nz archive --action verify --output-dir "build/warc/${{ matrix.source_set }}/" --format json > "build/receipts/${{ matrix.source_set }}/archive.json"
      - name: Replay & Verification Drill
        if: steps.capture-status.outputs.status == 'captured' || steps.capture-status.outputs.status == 'partial'
        run: |
          .venv/bin/archive-govt-nz replay --verify-all --cas-dir "build/cas/${{ matrix.source_set }}" --format json > "build/receipts/${{ matrix.source_set }}/replay.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: harvest-receipts-${{ matrix.source_set }}
          path: |
            build/receipts/${{ matrix.source_set }}/
            build/warc/${{ matrix.source_set }}/
            build/cas/${{ matrix.source_set }}/
          retention-days: 90
          if-no-files-found: error

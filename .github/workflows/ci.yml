name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Assurance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      COVERAGE_CORE: ctrace
      PYTHON_JIT: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: "0.12.17"
      - name: Run locked assurance gate
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            pytest_workers=1
          else
            pytest_workers=auto
          fi
          uv run --locked python tools/check.py \
            --pytest-workers "$pytest_workers" \
            --pytest-distribution loadscope
      - name: Export Cobertura coverage
        if: matrix.os == 'ubuntu-latest' && always()
        run: uv run --locked coverage xml -o coverage.xml
      - name: Preserve required local coverage evidence
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
      - name: Download pinned Codecov CLI
        id: codecov_download
        continue-on-error: true
        if: matrix.os == 'ubuntu-latest' && always()
        shell: bash
        run: |
          codecov_binary="$RUNNER_TEMP/codecovcli_linux"
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/codecov/codecov-cli/releases/download/v11.3.1/codecovcli_linux \
            --output "$codecov_binary"
          printf '%s  %s\n' \
            ca1d64196d2d34771084afe76ea657d581bf628e31d993ff8e52ea09cc88a56d \
            "$codecov_binary" | sha256sum --check --strict
          chmod +x "$codecov_binary"
      - name: Upload coverage to Codecov
        id: codecov_upload
        continue-on-error: true
        if: matrix.os == 'ubuntu-latest' && always() && steps.codecov_download.outcome == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          binary: ${{ runner.temp }}/codecovcli_linux
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Report external coverage upload failure
        if: matrix.os == 'ubuntu-latest' && always() && (steps.codecov_download.outcome == 'failure' || steps.codecov_upload.outcome == 'failure')
        shell: bash
        run: |
          echo "::warning::External Codecov reporting failed. Required local coverage gate and retained coverage artifact remain authoritative."

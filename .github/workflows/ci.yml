name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Assurance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows exceeded the aggregate 30-minute job cap twice; each gate
    # retains its independent 20-minute process bound.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    env:
      COVERAGE_CORE: ctrace
      PYTHON_JIT: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.15.1"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          version: "0.13.5"
      - name: Verify native Windows output pinning
        if: matrix.os == 'windows-latest'
        timeout-minutes: 5
        run: >-
          uv run --locked pytest
          tests/domains/health_appropriations/test_operation_gold_output.py
          tests/parliament/test_recovery.py::test_robots_fail_closed
          tests/parliament/test_guards.py::test_api_failure_does_not_advance_cursor
          tests/tools/test_windows_assurance.py -q --no-cov
      - name: Run locked assurance gate
        if: matrix.os != 'windows-latest'
        timeout-minutes: 55
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          pytest_workers=auto
          pytest_distribution=loadscope
          pytest_reporting=()
          assurance_profile="pr"
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            assurance_profile="release"
          fi
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            pytest_workers=1
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            pytest_distribution=worksteal
            pytest_reporting+=(--pytest-diagnostics)
          fi
          uv run --locked python tools/check.py \
            --profile "$assurance_profile" \
            --pytest-workers "$pytest_workers" \
            --pytest-distribution "$pytest_distribution" \
            "${pytest_reporting[@]}" 2>&1 | tee build/assurance.log
      - name: Run native Windows locked assurance gate
        if: matrix.os == 'windows-latest'
        timeout-minutes: 55
        shell: pwsh
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          uv run --locked python tools/windows_assurance.py --profile pr
          exit $LASTEXITCODE
      - name: Verify installed runtime package
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ./scripts/smoke-package.sh
      - name: Preserve Windows assurance diagnostics
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-assurance-${{ github.sha }}-${{ github.run_attempt }}
          path: build/assurance.log
          if-no-files-found: error
      - name: Preserve completed Windows pytest report
        if: always() && matrix.os == 'windows-latest' && hashFiles('build/pytest-results.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-pytest-${{ github.sha }}-${{ github.run_attempt }}
          path: build/pytest-results.xml
          if-no-files-found: error
      - name: Preserve dependency audit receipt
        if: always() && hashFiles('build/pip-audit.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-audit-${{ matrix.os }}-${{ github.sha }}
          path: build/pip-audit.json
          if-no-files-found: error
      - name: Export Cobertura coverage
        if: matrix.os == 'ubuntu-latest' && always()
        run: uv run --locked coverage xml -o coverage.xml
      - name: Preserve required local coverage evidence
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
      - name: Download pinned Codecov CLI
        id: codecov_download
        continue-on-error: true
        if: matrix.os == 'ubuntu-latest' && always()
        shell: bash
        run: |
          codecov_binary="$RUNNER_TEMP/codecovcli_linux"
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/codecov/codecov-cli/releases/download/v11.3.1/codecovcli_linux \
            --output "$codecov_binary"
          printf '%s  %s\n' \
            ca1d64196d2d34771084afe76ea657d581bf628e31d993ff8e52ea09cc88a56d \
            "$codecov_binary" | sha256sum --check --strict
          chmod +x "$codecov_binary"
      - name: Upload coverage to Codecov
        id: codecov_upload
        continue-on-error: true
        if: matrix.os == 'ubuntu-latest' && always() && steps.codecov_download.outcome == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          binary: ${{ runner.temp }}/codecovcli_linux
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Report external coverage upload failure
        if: matrix.os == 'ubuntu-latest' && always() && (steps.codecov_download.outcome == 'failure' || steps.codecov_upload.outcome == 'failure')
        shell: bash
        run: |
          echo "::warning::External Codecov reporting failed. Required local coverage gate and retained coverage artifact remain authoritative."

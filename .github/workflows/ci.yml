name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install uv
      - name: Run locked assurance gate
        run: uv run --locked python tools/check.py
      - name: Export Cobertura coverage
        if: always()
        run: uv run --locked coverage xml -o coverage.xml
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@0f8570b1a125f4937846a11fcfa3bcd548bd8c97
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          use_oidc: true

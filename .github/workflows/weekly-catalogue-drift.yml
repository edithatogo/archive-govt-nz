name: Weekly catalogue drift detection

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-catalogue-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install uv
      - run: uv run --locked python tools/discover_global_ckan.py --output build/drift/current-scope.json --page-size 100
      - run: uv run --locked python tools/detect_catalogue_drift.py --previous evidence/global-ckan-scope.json --current build/drift/current-scope.json --output build/drift/catalogue-drift-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: weekly-catalogue-drift
          path: build/drift
          if-no-files-found: error

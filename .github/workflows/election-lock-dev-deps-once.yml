name: One-time election optional scientific tooling lock
on:
  push:
    branches: [fix/election-2026-publication-integrity-20261111]
    paths:
      - '.github/workflows/election-lock-dev-deps-once.yml'
permissions:
  contents: read
concurrency:
  group: election-optional-dependency-lock
  cancel-in-progress: false
jobs:
  add-dev-dependencies:
    if: github.repository == 'edithatogo/archive-govt-nz' && github.actor == 'edithatogo'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/election-2026-publication-integrity-20261111
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Resolve research-only scientific type dependencies
        run: |
          uv add --dev "polars>=1.35,<2" "pandas>=3,<4" "scipy>=1.16,<2" "scikit-learn>=1.7,<2" "umap-learn>=0.5,<1" "python-pptx>=1.0,<2" "xgboost>=3,<4"
          uv lock --check
      - name: Commit locked dev environment
        run: |
          git add pyproject.toml uv.lock
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(elections): lock optional scientific research dependencies'
            git push origin HEAD:refs/heads/fix/election-2026-publication-integrity-20261111
          fi

name: Gated Legislation Reconciliation

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      confirmed_reconciliation:
        description: "Confirm read-only reconciliation of a selected state artifact"
        required: true
        type: boolean
        default: false
      state_run_id:
        description: "Successful harvest run ID containing complete state (blank for latest)"
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: gated-legislation-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      LEGISLATION_API_KEY: ${{ secrets.LEGISLATION_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.6.5
      - name: Restore selected complete state
        env:
          CONFIRMED: ${{ github.event_name == 'schedule' || inputs.confirmed_reconciliation }}
          GH_TOKEN: ${{ github.token }}
          STATE_RUN_ID: ${{ inputs.state_run_id }}
        run: |
          test "$CONFIRMED" = true
          TARGET_RUN_ID="$STATE_RUN_ID"
          if [ -z "$TARGET_RUN_ID" ]; then
            echo "No manual state_run_id provided. Auto-discovering latest successful harvest run..."
            TARGET_RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "scheduled-legislation-harvest.yml" \
              --branch "${GITHUB_REF_NAME:-main}" \
              --status "success" \
              --limit 5 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
          fi
          if [ -z "$TARGET_RUN_ID" ]; then
            echo "No prior successful harvest run found for reconciliation."
            exit 2
          fi
          case "$TARGET_RUN_ID" in (*[!0-9]*|'') exit 2;; esac
          mkdir -p build/legislation-state
          gh run download "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "legislation-state-$TARGET_RUN_ID" --dir build/legislation-state
      - name: Reconcile authenticated state
        run: |
          uv run --locked python tools/run_legislation_reconciliation.py \
            --manifest-path build/legislation-state/manifest.json \
            --checkpoint-path build/legislation-state/checkpoint.json \
            --cas-path build/legislation-state/cas \
            --receipt-path build/reconciliation/receipt.json \
            --hosted-dataset-slug ""
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legislation-reconciliation-${{ github.run_id }}
          path: build/reconciliation/
          if-no-files-found: error

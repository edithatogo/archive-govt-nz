name: Gated Legislation Reconciliation

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      confirmed_reconciliation:
        description: "Confirm read-only reconciliation of a selected state artifact"
        required: true
        type: boolean
        default: false
      verification_id:
        description: "Execution identity for a reviewed initial authority; optional for continuation"
        required: false
        type: string
        default: ""
      parent_reference:
        description: "Committed pinned parent reference (no latest-run lookup)"
        required: true
        type: string
        default: "config/legislation/parents/current.json"
      restoration_mode:
        description: "Initial modes require separate reviewed authority"
        required: true
        type: choice
        options: [continuation, adopt]
        default: continuation
      initial_authority:
        description: "Committed authority path; required only for initial modes"
        required: false
        type: string
        default: ""
      confirmed_initial:
        description: "Confirm the separately reviewed initial-state authority"
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: gated-legislation-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      LEGISLATION_API_KEY: ${{ secrets.LEGISLATION_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.6.5
      - name: Validate explicit operation authority
        env:
          CONFIRMED: ${{ github.event_name == 'schedule' || inputs.confirmed_reconciliation }}
        run: test "$CONFIRMED" = true
      - name: Verify selected parent before any state consumer
        uses: ./.github/actions/legislation-parent-state
        with:
          mode: ${{ inputs.restoration_mode || 'continuation' }}
          parent-reference: ${{ inputs.parent_reference || 'config/legislation/parents/current.json' }}
          authority: ${{ inputs.initial_authority }}
          confirmed-initial: ${{ inputs.confirmed_initial || false }}
          execution-id: ${{ inputs.verification_id || format('verification-{0}', github.run_id) }}
          github-token: ${{ github.token }}
      - name: Reconcile authenticated state
        run: |
          uv run --locked python tools/run_legislation_reconciliation.py \
            --manifest-path build/legislation-state/manifest.json \
            --checkpoint-path build/legislation-state/checkpoint.json \
            --cas-path build/legislation-state/cas \
            --receipt-path build/reconciliation/receipt.json \
            --hosted-dataset-slug ""
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legislation-reconciliation-${{ github.run_id }}
          path: build/reconciliation/
          if-no-files-found: error

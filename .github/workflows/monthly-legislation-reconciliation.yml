name: Monthly Legislation Reconciliation

on:
  schedule:
    - cron: "17 3 1 * *" # 1st of every month at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: reconcile-legislation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monthly-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.6.5
      - name: Prepare receipt directories
        run: mkdir -p build/receipts/legislation build/manifests
      - name: Run Full Inventory Reconciliation
        run: |
          uv run --locked python tools/run_legislation_reconciliation.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legislation-monthly-reconciliation
          path: build/receipts/legislation/
          if-no-files-found: error

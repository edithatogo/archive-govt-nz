name: Scheduled broader-health discovery

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-health-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.15.1"
      - run: python -m pip install uv
      - name: Discover health metadata
        id: discovery
        run: >-
          uv run --locked python tools/discover_health_metadata.py
          --output build/live/health-discovery.json --page-size 100
      - name: Record bounded operations heartbeat
        if: always()
        env:
          WORKFLOW_OUTCOME: ${{ steps.discovery.outcome }}
        run: >-
          uv run --locked python -m archive_govt_nz.health_heartbeat
          --manifest build/live/health-discovery.json
          --workflow-outcome "$WORKFLOW_OUTCOME"
          --output build/live/health-discovery-heartbeat.json
          --report-output build/live/health-discovery-report.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: scheduled-health-discovery
          path: |
            build/live/health-discovery.json
            build/live/health-discovery-heartbeat.json
            build/live/health-discovery-report.md
            build/live/health-discovery-raw/
          if-no-files-found: error

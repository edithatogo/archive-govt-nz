name: Scheduled broader-health discovery

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-health-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.14"
      - run: python -m pip install uv
      - run: >-
          uv run --locked python tools/discover_health_metadata.py
          --output build/live/health-discovery.json --page-size 100
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: scheduled-health-discovery
          path: build/live/health-discovery.json
          if-no-files-found: error

name: Elections Frontier CI/CD & Space Sync

on:
  push:
    branches: [main]
    paths:
      - 'src/archive_govt_nz/domains/elections/**'
      - 'spaces/nz-election-explorer/**'
      - 'schemas/election/**'
      - 'zk/**'
      - 'tests/test_elections_*.py'
      - '.github/workflows/elections-frontier-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/archive_govt_nz/domains/elections/**'
      - 'spaces/nz-election-explorer/**'
      - 'schemas/election/**'
      - 'zk/**'
      - 'tests/test_elections_*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Test & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv & dependencies
        run: |
          pip install uv
          uv pip install --system pytest pytest-cov pydantic pyarrow duckdb plotly gradio xgboost scikit-learn matplotlib jsonschema huggingface_hub umap-learn

      - name: Run Focused Election Test Suite
        env:
          PYTHONPATH: src:.
        run: |
          pytest tests/test_elections_*.py -v --cov=src/archive_govt_nz/domains/elections --cov-fail-under=70 --cov-report=term-missing

  sync-hf-space:
    name: Sync to Hugging Face Spaces
    needs: test-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependencies
        run: |
          pip install huggingface_hub

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            python scripts/deploy_hf_space.py
          else
            echo "HF_TOKEN not set; skipping automated space push."
          fi

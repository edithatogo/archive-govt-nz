name: Parliament durable continuation

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Verify cold restore, bounded pilot, or enabled continuation'
        type: choice
        options: [verify, pilot, run]
        default: verify
      max_batches:
        description: 'Maximum small bounded attempts; every attempt checkpoints'
        type: number
        default: 1
      hold_seconds:
        description: 'Pilot cancellation barrier after a durable discovery checkpoint'
        type: number
        default: 0

permissions:
  contents: read
  actions: read

concurrency:
  group: parliament-report-writer
  cancel-in-progress: false

jobs:
  continue:
    if: github.repository == 'edithatogo/archive-govt-nz' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '30'
      HF_HUB_ETAG_TIMEOUT: '20'
      PYTHON_JIT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.5'
          python-version: '3.15.1'
      - name: Install locked repo-local runtime
        run: |
          uv sync --locked
          .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3,15,1)'
      - name: Restore and continue approved reports
        env:
          OPERATION: ${{ github.event_name == 'schedule' && 'run' || inputs.operation }}
          MAX_BATCHES: ${{ github.event_name == 'schedule' && 1000 || inputs.max_batches }}
          HOLD_SECONDS: ${{ inputs.hold_seconds || '0' }}
        run: >-
          .venv/bin/python tools/parliament_hosted.py "$OPERATION"
          --state-dir build/parliament-hosted/state
          --receipt build/parliament-hosted/receipt.json
          --max-batches "$MAX_BATCHES" --hold-seconds "$HOLD_SECONDS"
          --max-seconds 10800
      - name: Preserve sanitized invocation receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: parliament-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/parliament-hosted/receipt.json
          if-no-files-found: error
          retention-days: 90

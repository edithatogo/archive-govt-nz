name: Scheduled Legislation Harvest

on:
  schedule:
    - cron: "23 18 * * 0" # Weekly Sunday 18:23 UTC (Monday 06:23 NZST)
  workflow_dispatch:
    inputs:
      backfill_limit:
        description: "Max works to backfill (optional integer)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: harvest-legislation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest-legislation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.6.5
      - name: Prepare receipt directories
        run: mkdir -p build/receipts/legislation build/corpus/legislation
      - name: Run Incremental Discovery & Sync
        run: |
          uv run --locked archive-govt-nz legislation --action discover --format json > build/receipts/legislation/discovery.json
          uv run --locked archive-govt-nz capture --source-type legislation --format json > build/receipts/legislation/capture.json
      - name: Generate Validation & Manifest
        run: |
          uv run --locked archive-govt-nz legislation --action validate --format json > build/receipts/legislation/validate.json
          uv run --locked archive-govt-nz legislation --action manifest --format json > build/receipts/legislation/manifest.json
      - name: Calculate Coverage
        run: |
          uv run --locked archive-govt-nz legislation --action coverage --format json > build/receipts/legislation/coverage.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legislation-harvest-receipts
          path: build/receipts/legislation/
          if-no-files-found: error

name: Bounded Legislation Harvest

on:
  workflow_dispatch:
    inputs:
      confirmed_execution:
        description: "Confirm this bounded source acquisition"
        required: true
        type: boolean
        default: false
      batch_id:
        description: "Unique canonical batch identity"
        required: true
        type: string
      search_terms:
        description: "One discovery search term per line"
        required: true
        type: string
      max_works:
        description: "Positive maximum discovered works"
        required: true
        type: number
        default: 25
      prior_state_run_id:
        description: "Prior successful run ID containing full state; blank for first batch"
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: bounded-legislation-harvest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest-legislation:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      LEGISLATION_API_KEY: ${{ secrets.LEGISLATION_API_KEY }}
    steps:
      - name: Enforce unresolved sequence and redistribution gates
        run: |
          echo "Blocked: one-batch, canary, and redistribution authority are pending."
          exit 3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.6.5
      - name: Validate explicit dispatch authority and scope
        env:
          CONFIRMED_EXECUTION: ${{ inputs.confirmed_execution }}
          BATCH_ID: ${{ inputs.batch_id }}
          MAX_WORKS: ${{ inputs.max_works }}
          SEARCH_TERMS: ${{ inputs.search_terms }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          if os.environ["CONFIRMED_EXECUTION"] != "true":
              raise SystemExit("confirmed_execution must be true")
          if not os.environ["BATCH_ID"].strip():
              raise SystemExit("batch_id is required")
          if int(os.environ["MAX_WORKS"]) <= 0:
              raise SystemExit("max_works must be positive")
          terms = [line.strip() for line in os.environ["SEARCH_TERMS"].splitlines() if line.strip()]
          if not terms:
              raise SystemExit("at least one search term is required")
          Path("build").mkdir(exist_ok=True)
          Path("build/legislation-search-terms.txt").write_text("\n".join(terms) + "\n", encoding="utf-8")
          PY
      - name: Prepare full state directories
        run: mkdir -p build/legislation-state/cas build/legislation-state/receipts
      - name: Restore explicitly selected prior full state
        if: inputs.prior_state_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_RUN_ID: ${{ inputs.prior_state_run_id }}
        run: |
          case "$STATE_RUN_ID" in (*[!0-9]*|'') exit 2;; esac
          gh run download "$STATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "legislation-state-$STATE_RUN_ID" --dir build/restored-state
          cp -R build/restored-state/. build/legislation-state/
      - name: Execute bounded service-backed harvest
        env:
          BATCH_ID: ${{ inputs.batch_id }}
          MAX_WORKS: ${{ inputs.max_works }}
        run: |
          uv run --locked python tools/run_legislation_harvest.py \
            --checkpoint-path build/legislation-state/checkpoint.json \
            --manifest-path build/legislation-state/manifest.json \
            --cas-path build/legislation-state/cas \
            --receipt-path build/legislation-state/receipts/harvest.json \
            --batch-id "$BATCH_ID" \
            --search-terms-file build/legislation-search-terms.txt \
            --max-works "$MAX_WORKS"
      - name: Upload complete continuation state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legislation-state-${{ github.run_id }}
          path: build/legislation-state/
          if-no-files-found: error
          retention-days: 90
      - name: Upload bounded failure receipt
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legislation-failure-${{ github.run_id }}
          path: build/legislation-state/receipts/
          if-no-files-found: warn

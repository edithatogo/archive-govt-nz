name: Bounded Legislation Harvest

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      confirmed_execution:
        description: "Confirm this bounded source acquisition"
        required: true
        type: boolean
        default: false
      batch_id:
        description: "Unique canonical batch identity"
        required: true
        type: string
      search_terms:
        description: "One discovery search term per line"
        required: true
        type: string
      max_works:
        description: "Positive maximum discovered works"
        required: true
        type: number
        default: 25
      prior_state_run_id:
        description: "Prior successful run ID containing full state; blank for first batch"
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: bounded-legislation-harvest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest-legislation:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      LEGISLATION_API_KEY: ${{ secrets.LEGISLATION_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.6.5
      - name: Validate explicit dispatch authority and scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRMED_EXECUTION: ${{ github.event_name == 'schedule' || inputs.confirmed_execution }}
          BATCH_ID: ${{ github.event_name == 'schedule' && format('scheduled-weekly-{0}', github.run_id) || inputs.batch_id }}
          MAX_WORKS: ${{ github.event_name == 'schedule' && 50 || inputs.max_works }}
          SEARCH_TERMS: ${{ github.event_name == 'schedule' && 'Act,Bill,Regulation' || inputs.search_terms }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          if os.environ["CONFIRMED_EXECUTION"] != "true":
              raise SystemExit("confirmed_execution must be true")
          if not os.environ["BATCH_ID"].strip():
              raise SystemExit("batch_id is required")
          if int(os.environ["MAX_WORKS"]) <= 0:
              raise SystemExit("max_works must be positive")
          terms = [
              term.strip()
              for term in re.split(r"[,\n\r]+|\\n", os.environ["SEARCH_TERMS"])
              if term.strip()
          ]
          if not terms:
              raise SystemExit("at least one search term is required")
          Path("build").mkdir(exist_ok=True)
          Path("build/legislation-search-terms.txt").write_text("\n".join(terms) + "\n", encoding="utf-8")
          PY
      - name: Prepare full state directories
        run: mkdir -p build/legislation-state/cas build/legislation-state/receipts
      - name: Restore prior state (auto-discover latest if prior_state_run_id blank)
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ inputs.prior_state_run_id }}
        run: |
          TARGET_RUN_ID="$MANUAL_RUN_ID"
          if [ -z "$TARGET_RUN_ID" ]; then
            echo "No manual prior_state_run_id provided. Auto-discovering latest successful run..."
            TARGET_RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "scheduled-legislation-harvest.yml" \
              --branch "${GITHUB_REF_NAME:-main}" \
              --status "success" \
              --limit 5 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
          fi
          if [ -n "$TARGET_RUN_ID" ]; then
            case "$TARGET_RUN_ID" in (*[!0-9]*|'') exit 2;; esac
            echo "Restoring state from Run ID: $TARGET_RUN_ID"
            mkdir -p build/restored-state
            if gh run download "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "legislation-state-$TARGET_RUN_ID" --dir build/restored-state; then
              cp -R build/restored-state/. build/legislation-state/
              echo "Successfully restored state from run $TARGET_RUN_ID"
            fi
          else
            echo "No prior successful run found. Proceeding with initial empty state."
          fi
      - name: Execute bounded service-backed harvest
        env:
          BATCH_ID: ${{ github.event_name == 'schedule' && format('scheduled-weekly-{0}', github.run_id) || inputs.batch_id }}
          MAX_WORKS: ${{ github.event_name == 'schedule' && 50 || inputs.max_works }}
        run: |
          uv run --locked python tools/run_legislation_harvest.py \
            --checkpoint-path build/legislation-state/checkpoint.json \
            --manifest-path build/legislation-state/manifest.json \
            --cas-path build/legislation-state/cas \
            --receipt-path build/legislation-state/receipts/harvest.json \
            --batch-id "$BATCH_ID" \
            --search-terms-file build/legislation-search-terms.txt \
            --max-works "$MAX_WORKS"
      - name: Upload complete continuation state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legislation-state-${{ github.run_id }}
          path: build/legislation-state/
          if-no-files-found: error
          retention-days: 90
      - name: Upload bounded failure receipt
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legislation-failure-${{ github.run_id }}
          path: build/legislation-state/receipts/
          if-no-files-found: warn

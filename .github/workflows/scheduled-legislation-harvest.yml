name: Scheduled Legislation Harvest

on:
  schedule:
    - cron: "23 18 * * 0" # Weekly Sunday 18:23 UTC (Monday 06:23 NZST)
  workflow_dispatch:
    inputs:
      backfill_limit:
        description: "Max works to backfill (optional integer)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: harvest-legislation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest-legislation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.6.5
      - name: Prepare receipt directories
        run: mkdir -p build/receipts/legislation build/manifests build/checkpoints build/cas
      - name: Execute Verified Legislation Harvest Orchestration
        run: |
          BACKFILL_FLAG=""
          if [ -n "${{ github.event.inputs.backfill_limit }}" ]; then
            BACKFILL_FLAG="--backfill-limit ${{ github.event.inputs.backfill_limit }}"
          fi
          uv run --locked python tools/run_legislation_harvest.py $BACKFILL_FLAG
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legislation-harvest-receipts
          path: build/receipts/legislation/
          if-no-files-found: error
